<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pertarungan Ajaib Matematika</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <button id="start-btn">Start</button>
    
    <div id="game-screen" class="hidden">
      <img src="https://th.bing.com/th/id/OIP.BbklSLtC8WDohD2GACuxXwHaHa?w=250&h=250&c=8&rs=1&qlt=90&o=6&dpr=1.1&pid=3.1&rm=2g" id="fireball" class="hidden" />
      <img id="background" src="assets/images/background.jpg" alt="Background" />
      <img id="wizard" src="assets/images/wizard.png" alt="Wizard" />
      <img id="monster" src="assets/images/monster.png" alt="Monster" />
      <div id="question-box">
        <p id="question-text">Berapakah 2 + 3?</p>
        <input type="number" id="answer-input" placeholder="Jawab di sini..." />
        <button id="submit-answer">Jawab</button>
      </div>
  </div>
    </div>


  <script src="script.js"></script>
</body>
</html>
